# osv-scanner 豁免清单（.husky/pre-push 的门读这个文件）
#
# 文件名必须是 `osv-scanner.toml`（不带点）：实测带点的 `.osv-scanner.toml` 不会被自动
# 发现，门照旧红。hook 跑的是裸命令 `osv-scanner --lockfile package-lock.json`，靠的就是
# 这个自动发现，所以改名的同时要一起改 hook。
#
# `ignoreUntil` 是真会执行的（实测：过去日期 → 重新报错；未来日期 → 放行），不是注释。
# 每条都必须带理由 + 到期日；到期后门会重新挡，逼着回头看，而不是永久沉默豁免。

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = """
picomatch ReDoS（<=4.0.7）。dev-only 传递依赖：tailwind v3 的 watch/glob 链与 vitest 的
glob 匹配都走它，不进生产产物。上游还没有修复版：npm 上最新即 4.0.7，OSV 的 affected
只有 last_affected、没有 fixed 事件，所以 `npm audit fix` 修不掉——`--package-lock-only`
实测会顺带改写约 1500 行无关版本（oxc-parser 等）且仍留 33 个 high，已回滚。到期若上游
仍无 4.0.8，改走替换 glob 依赖链的根治路线，而不是继续续期。
"""
ignoreUntil = "2026-11-30T00:00:00Z"
