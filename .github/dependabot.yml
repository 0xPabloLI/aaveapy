# Version updates 已关闭：不再按周期提「有新版本」的 PR。
# 使用 open-pull-requests-limit: 0（GitHub 官方推荐的关闭方式），避免仅写 updates: [] 时仍触发周更任务。
# 仅保留 Security updates（在 Repo → Settings → Code security and analysis → Dependabot security updates 中启用）。
# 需要恢复按周版本更新时：把下方对应 ecosystem 的 open-pull-requests-limit 调大（如 5），并补回 schedule / groups 等。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
