name: CI Auto Remediation

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - main
      - dev
      - railway
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to remediate (default: repository default branch)'
        required: false
        type: choice
        options:
          - dev
          - main

concurrency:
  group: ci-auto-remediation-${{ github.event.workflow_run.head_branch || github.event.inputs.branch || 'default' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  remediate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    steps:
      - name: Check if CI failure is unfixable (ERESOLVE or peer-dep-check)
        id: skip-check
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('skip', 'false');
            const runId = context.payload.workflow_run.id;
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            for (const job of jobs) {
              if (job.conclusion !== 'failure') continue;
              if (job.name === 'peer-dep-check') {
                core.setOutput('skip', 'true');
                core.notice('peer-dep-check failed — peer dep conflict cannot be fixed by audit. Skipping.');
                return;
              }
              let log;
              try {
                const resp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                log = resp.data;
              } catch (e) {
                core.warning(`Could not download logs for job ${job.name} (id=${job.id}): ${e.message}. Assuming no ERESOLVE.`);
                continue;
              }
              if (/npm error code ERESOLVE/.test(log)) {
                core.setOutput('skip', 'true');
                core.notice('CI failure contains ERESOLVE — peer dep conflict cannot be fixed by audit. Skipping.');
                return;
              }
            }

      - name: Skip remediation for unfixable failures
        if: steps.skip-check.outputs.skip == 'true'
        run: exit 0

      # Resolution and validation are one step so the branch cannot reach `checkout`,
      # the PR base, or the auto-approve below without having been checked: the value
      # is emitted to $GITHUB_OUTPUT only after it matches. `workflow_run.branches`
      # filters the automatic path, but the manual one is a free-form dispatch input,
      # and `lovable` is archived yet still exists as a branch (AGENTS.md). The value
      # arrives through `env:` rather than being interpolated into the script, so a
      # crafted input is compared as data and never evaluated as shell code.
      - name: Resolve and validate target branch
        if: steps.skip-check.outputs.skip != 'true'
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_BRANCH" ]; then
            target="$DISPATCH_BRANCH"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$TRIGGER_BRANCH" ]; then
            target="$TRIGGER_BRANCH"
          else
            target="$DEFAULT_BRANCH"
          fi

          case "$target" in
            dev|main)
              echo "name=$target" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Refusing to remediate '$target'. Active branches are dev and main; lovable was retired 2026-11-12 (see AGENTS.md)."
              exit 1
              ;;
          esac

      - name: Checkout target branch
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Setup Node
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: npm run ci:lockcheck

      - name: Attempt dependency remediation
        if: steps.skip-check.outputs.skip != 'true'
        run: npm run ci:auto-fix

      - name: Reinstall dependencies for verification
        if: steps.skip-check.outputs.skip != 'true'
        run: npm run ci:lockcheck

      - name: Validate checks after remediation
        if: steps.skip-check.outputs.skip != 'true'
        id: verify
        run: |
          set +e
          npm run lint
          LINT=$?
          npm test
          TEST=$?
          npm run build
          BUILD=$?
          npm audit --omit=dev --audit-level=high
          AUDIT=$?
          if [ "$LINT" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$AUDIT" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Check for generated changes
        if: steps.skip-check.outputs.skip != 'true'
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation PR
        id: cpr
        if: steps.skip-check.outputs.skip != 'true' && steps.verify.outputs.ok == 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: auto-remediate dependency issues after CI failure'
          branch: 'bot/ci-auto-remediation-${{ github.run_id }}'
          delete-branch: true
          title: 'chore: auto remediation for CI failure (${{ steps.branch.outputs.name }})'
          body: |
            Auto-generated remediation PR.

            Trigger:
            - Event: `${{ github.event_name }}`
            - Source branch: `${{ steps.branch.outputs.name }}`

            Actions performed:
            - `npm run ci:auto-fix`
            - `npm run lint`
            - `npm test`
            - `npm run build`
            - `npm audit --omit=dev --audit-level=high`
          labels: ci-auto-remediation,dependencies
          base: ${{ steps.branch.outputs.name }}

      - name: Review and enable auto-merge for remediation PR
        if: steps.skip-check.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != '' && steps.branch.outputs.name != 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.HARDCODE_SYNC_PAT != '' && secrets.HARDCODE_SYNC_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.cpr.outputs.pull-request-number }}');
            if (!prNumber) {
              core.info('No remediation PR created; skip review/auto-merge.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Automated review approval by CODEX_BOT_TOKEN.',
              });
            } catch (error) {
              core.warning(`Auto-approve failed for PR #${prNumber}: ${error.message}`);
            }
            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: pr.data.node_id }
              );
            } catch (error) {
              core.warning(`Enable auto-merge failed for PR #${prNumber}: ${error.message}`);
            }
