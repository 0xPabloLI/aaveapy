# Standalone schedule / manual run for live API schema tests (same logic as CI job on main).
# See docs/conventions/ci-live-schema-cloudflare.md
name: Live schema validation

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1' # Monday 06:20 UTC

permissions:
  contents: read

jobs:
  live-schema-validation:
    name: live-schema-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Validate API schemas against live endpoints
        env:
          LIVE_TEST_API_BASE: "https://staging-api.aaveapy.com/api"
          RUN_LIVE_TESTS: "true"
          LIVE_TESTS_SKIP_WHEN_CHALLENGE: "true"
        run: bash scripts/ci-live-schema-validate.sh
