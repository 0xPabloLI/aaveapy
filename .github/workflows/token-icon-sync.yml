name: Token Icon Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target base branch for the sync PR (default: dev). Scheduled runs use dev and main.'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - main
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 04:20 UTC — runs against dev and main (matrix).
    - cron: '20 4 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-token-icons:
    env:
      HAS_SYNC_PAT: ${{ secrets.TOKEN_ICON_SYNC_PAT != '' || secrets.HARDCODE_SYNC_PAT != '' }}
      # LIVE_TEST_API_BASE_CI only on the sync step so checkout does not log the secret value (see hardcode-sync.yml).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch: ${{ github.event_name == 'schedule' && fromJSON('["dev","main"]') || fromJSON(format('["{0}"]', (github.event_name == 'repository_dispatch' && github.event.client_payload.target_branch != '' && github.event.client_payload.target_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch != '' && github.event.inputs.target_branch) || 'dev')) }}
    steps:
      # First step on purpose: an unsupported target must not check out, install, sync
      # or open a PR. `lovable` is archived (AGENTS.md) but still exists as a branch, so
      # a dispatch naming it would otherwise check out cleanly and open a PR against it
      # carrying the `automerge` label. The `choice` type on the input does not cover
      # `repository_dispatch`, whose `client_payload.target_branch` bypasses the form.
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ matrix.target_branch }}
        run: |
          case "$TARGET_BRANCH" in
            dev|main)
              echo "Sync target: $TARGET_BRANCH"
              ;;
            *)
              echo "::error::Unsupported sync target '$TARGET_BRANCH'. Active branches are dev and main; lovable was retired 2026-11-12 (see AGENTS.md)."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target_branch }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync token icons
        env:
          LIVE_TEST_API_BASE_CI: ${{ secrets.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: npm run sync-token-icons

      - name: Create PR when icons changed
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Use PAT to ensure pull_request workflows (CI lint/build) are triggered on created PRs.
          # Fallback to GITHUB_TOKEN keeps behavior but may leave required checks in "Expected".
          token: ${{ secrets.TOKEN_ICON_SYNC_PAT != '' && secrets.TOKEN_ICON_SYNC_PAT || secrets.HARDCODE_SYNC_PAT != '' && secrets.HARDCODE_SYNC_PAT || github.token }}
          commit-message: 'chore(icons): sync token icons'
          title: 'chore(icons): sync token icons'
          body: |
            Automated update from `npm run sync-token-icons`.
          branch: 'bot/token-icon-sync-${{ matrix.target_branch }}-${{ github.run_id }}'
          base: ${{ matrix.target_branch }}
          delete-branch: true
          labels: |
            ${{ matrix.target_branch != 'main' && 'automerge' || '' }}
            assets

      - name: Warn when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_SYNC_PAT != 'true'
        run: |
          echo "::warning::TOKEN_ICON_SYNC_PAT/HARDCODE_SYNC_PAT is not configured. PR was created with GITHUB_TOKEN, so pull_request CI may stay in 'Expected'. Fallback workflow_dispatch CI will be triggered on the PR branch."

      - name: Trigger fallback CI when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_SYNC_PAT != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRef = `${{ steps.cpr.outputs.pull-request-branch }}`;
            const targetRef = `${{ steps.cpr.outputs.pull-request-head-sha }}` || workflowRef;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: workflowRef,
              inputs: {
                target_ref: targetRef
              }
            });
            core.info(`Triggered fallback workflow_dispatch for ci.yml on ref ${workflowRef}, target_ref ${targetRef}`);
