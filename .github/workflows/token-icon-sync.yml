name: Token Icon Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 04:20 UTC
    - cron: "20 4 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-token-icons:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync token icons
        run: npm run sync-token-icons

      - name: Create PR when icons changed
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(icons): sync token icons"
          title: "chore(icons): sync token icons"
          body: |
            Automated update from `npm run sync-token-icons`.
          branch: "bot/token-icon-sync"
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: |
            automation
            assets

      - name: Trigger CI for bot PR branch
        if: steps.create_pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"bot/token-icon-sync"}'
