# Dependabot PR 上只检测并报告 peer dependency 冲突，不改 package.json / lockfile，也不 push。
# 原因：原来两条自动修复路径都判断不了对齐方向——`npm install --legacy-peer-deps` 会把主版本错位
# 强推进 lockfile（@eslint/js v10 即由此进入 dev），`npm install <pkg>@latest` 则会去升级提出 peer
# 要求的那一方（把 eslint 拉到 10，反而撞 eslint-plugin-import / react-hooks 的 ^9 上限）。真正的
# 修法经常是回退被升的那一方，这需要人判断（AAV-1301）。
name: Dependabot – report peer conflicts

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  report-peer-conflicts:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (strict)
        id: install
        run: npm ci
        continue-on-error: true

      - name: Report peer dependency conflicts
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" = "failure" ]; then
            echo "::error title=npm ci failed::严格安装失败（peer 冲突）。对齐方向需人工决定，本 workflow 不再自动改写 lockfile。"
            exit 1
          fi

          INVALID=$(npm ls --all 2>&1 | grep -i "invalid" | grep -v "wagmi@3" || true)
          if [ -n "$INVALID" ]; then
            {
              echo "### Peer dependency conflicts"
              echo '```'
              echo "$INVALID"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=npm ls reports invalid peers::发现 peer 版本错位，明细见 step summary。"
            exit 1
          fi

          echo "No peer dependency conflicts"
