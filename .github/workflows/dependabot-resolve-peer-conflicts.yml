# When a Dependabot PR has peer dependency conflicts (e.g. npm install fails),
# automatically run npm install --legacy-peer-deps and push the updated lockfile
# so CI and Vercel preview can pass. No package-specific rules; applies to any conflict.
name: Dependabot – resolve peer conflicts

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  resolve-peer-conflicts:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (strict)
        id: install
        run: npm ci
        continue-on-error: true

      - name: Resolve peer dependency conflicts
        if: steps.install.outcome == 'failure'
        run: |
          npm install --legacy-peer-deps
          if git diff --quiet package-lock.json; then
            echo "No lockfile change, skipping push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): resolve peer dependency conflicts (legacy-peer-deps)"
          git push
