name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - railway
  push:
    branches:
      - main
      - dev
      - railway
      - feature/**
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ref (branch or SHA) to run CI against"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  peer-dep-check:
    name: peer-dep-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Check react/react-dom version match
        run: |
          REACT_V=$(node -p "require('react/package.json').version")
          RDOM_V=$(node -p "require('react-dom/package.json').version")
          echo "react=$REACT_V  react-dom=$RDOM_V"
          if [ "$REACT_V" != "$RDOM_V" ]; then
            echo "::error::react ($REACT_V) and react-dom ($RDOM_V) version mismatch!"
            exit 1
          fi
      - name: Check for peer dependency conflicts
        run: npm ls --all 2>&1 | grep -i "invalid" && exit 1 || echo "No peer dep conflicts"

  socket-firewall:
    name: socket-firewall
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Setup Socket Firewall
        uses: socketdev/action@v1
        with:
          mode: firewall
      - name: Install dependencies through Socket Firewall
        run: sfw npm ci

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm run ci:lockcheck
      # PR: one ESLint pass with Reviewdog annotations (avoids a duplicate workflow + second npm ci).
      # push / workflow_dispatch: plain eslint (Reviewdog reporter is PR-only).
      - name: Run ESLint (Reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1
        env:
          REVIEWDOG_VERSION: v0.20.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_level: error
      - name: Run ESLint
        if: github.event_name != 'pull_request'
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Run build
        run: npm run build
      - name: Run unit tests
        run: npm test

  live-schema-validation:
    name: live-schema-validation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Validate API schemas against live endpoints
        env:
          LIVE_TEST_API_BASE: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
          RUN_LIVE_TESTS: "true"
        run: bash scripts/ci-live-schema-validate.sh

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Audit runtime dependencies (High/Critical)
        run: npm audit --omit=dev --audit-level=high

  auto-remediate-on-failure:
    name: auto-remediate-on-failure
    needs:
      - peer-dep-check
      - lint
      - build
      - security-audit
    if: >
      always() &&
      github.event_name == 'push' &&
      !startsWith(github.ref_name, 'bot/ci-auto-remediation-') &&
      (needs.peer-dep-check.result == 'failure' || needs.lint.result == 'failure' || needs.build.result == 'failure' || needs.security-audit.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm run ci:lockcheck

      - name: Attempt dependency remediation
        run: npm run ci:auto-fix

      - name: Reinstall dependencies for verification
        run: npm run ci:lockcheck

      - name: Validate checks after remediation
        id: verify
        run: |
          set +e
          npm run lint
          LINT=$?
          npm test
          TEST=$?
          npm run build
          BUILD=$?
          npm audit --omit=dev --audit-level=high
          AUDIT=$?
          if [ "$LINT" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$AUDIT" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Check for generated changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation PR
        id: cpr
        if: steps.verify.outputs.ok == 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: auto-remediate dependency issues after CI failure"
          branch: "bot/ci-auto-remediation-${{ github.run_id }}"
          delete-branch: true
          title: "chore: auto remediation for CI failure (${{ github.ref_name }})"
          body: |
            Auto-generated remediation PR.

            Trigger:
            - Event: `${{ github.event_name }}`
            - Source branch: `${{ github.ref_name }}`
            - Lint: `${{ needs.lint.result }}`
            - Build: `${{ needs.build.result }}`
            - Security audit: `${{ needs.security-audit.result }}`

            Actions performed:
            - `npm run ci:auto-fix`
            - `npm run lint`
            - `npm test`
            - `npm run build`
            - `npm audit --omit=dev --audit-level=high`
          labels: ci-auto-remediation,dependencies
          base: ${{ github.ref_name }}
