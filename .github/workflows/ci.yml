name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
      - feature/merkl-forecast

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_AUTHOR=$(git log -1 --format='%an' ${{ github.event.pull_request.head.sha }})
          else
            HEAD_AUTHOR=$(git log -1 --format='%an')
          fi
          if [ "$HEAD_AUTHOR" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_AUTHOR=$(git log -1 --format='%an' ${{ github.event.pull_request.head.sha }})
          else
            HEAD_AUTHOR=$(git log -1 --format='%an')
          fi
          if [ "$HEAD_AUTHOR" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
