name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - railway
      - lovable
  push:
    branches:
      - main
      - dev
      - railway
      - lovable
      - feature/**
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ref (branch or SHA) to run CI against"
        required: false
  schedule:
    - cron: '0 6 * * *'  # daily UTC 6:00 — detect backend spec drift

permissions:
  contents: read
  pull-requests: write

jobs:
  peer-dep-check:
    name: peer-dep-check
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Check react/react-dom version match
        run: |
          REACT_V=$(node -p "require('react/package.json').version")
          RDOM_V=$(node -p "require('react-dom/package.json').version")
          echo "react=$REACT_V  react-dom=$RDOM_V"
          if [ "$REACT_V" != "$RDOM_V" ]; then
            echo "::error::react ($REACT_V) and react-dom ($RDOM_V) version mismatch!"
            exit 1
          fi
      - name: Check for peer dependency conflicts
        run: |
          INVALID=$(npm ls --all 2>&1 | grep -i "invalid" | grep -v "wagmi@3" || true)
          if [ -n "$INVALID" ]; then
            echo "::error::$INVALID"
            exit 1
          fi
          echo "No peer dep conflicts (wagmi@3 + rainbowkit@2 known mismatch, tracked for rainbowkit v3)"

  socket-firewall:
    name: socket-firewall
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Setup Socket Firewall
        uses: socketdev/action@v1
        with:
          mode: firewall
      - name: Install dependencies through Socket Firewall
        run: sfw npm ci

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm run ci:lockcheck
      # PR: one ESLint pass with Reviewdog annotations (avoids a duplicate workflow + second npm ci).
      # push / workflow_dispatch: plain eslint (Reviewdog reporter is PR-only).
      - name: Run ESLint (Reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1
        env:
          REVIEWDOG_VERSION: v0.20.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_level: error
      - name: Run ESLint
        if: github.event_name != 'pull_request'
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Run build
        run: npm run build
      - name: Run unit tests
        run: npm test

  live-schema-validation:
    name: live-schema-validation
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lovable') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Validate API schemas against live endpoints
        env:
          LIVE_TEST_API_BASE: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
          RUN_LIVE_TESTS: "true"
        run: bash scripts/ci-live-schema-validate.sh
  live-simulation-validation:
    name: live-simulation-validation
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lovable') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Run simulation Golden Rule tests against staging API
        env:
          LIVE_TEST_API_BASE: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
          RUN_LIVE_TESTS: "true"
        run: npm run test:live:simulation:staging

  openapi-check:
    name: openapi-check
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Check OpenAPI spec is up to date
        env:
          LIVE_API_BASE: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: npm run openapi:check

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm run ci:lockcheck
      - name: Audit runtime dependencies (High/Critical)
        run: |
          AUDIT=$(npm audit --omit=dev --json 2>/dev/null || true)

          # Load exemption list (package names with known upstream issues)
          EXEMPT_PKGS=$(jq -r '.exemptions | keys[]' .github/npm-audit-exemptions.json 2>/dev/null || echo "")

          # Find high/critical vulnerabilities NOT in the exemption list
          ISSUES=$(echo "$AUDIT" | jq -r --argjson exempt "$(echo "$EXEMPT_PKGS" | jq -R -s 'split("\n") | map(select(. != ""))')" '
            [.vulnerabilities // {} | to_entries[]
             | select(.value.severity == "high" or .value.severity == "critical")
             | select(.key as $name | $exempt | index($name) | not)]
            | map({name: .key, severity: .value.severity})
            | unique_by(.name)
          ' 2>/dev/null)

          COUNT=$(echo "$ISSUES" | jq 'length' 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::New high/critical vulnerabilities (not in exemption list):"
            echo "$ISSUES" | jq -r '.[] | "  \(.severity): \(.name)"'
            exit 1
          fi
          echo "Audit passed — no new high/critical vulnerabilities"

  openapi-sync:
    name: openapi-sync
    needs:
      - openapi-check
    if: >
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.openapi-check.result == 'failure'
    runs-on: ubuntu-latest
    env:
      LIVE_API_BASE: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm run ci:lockcheck

      - name: Fetch OpenAPI spec from backend
        run: npm run openapi:fetch

      - name: Check for spec changes
        id: diff
        run: |
          if git diff --quiet -- public/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create spec sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(openapi): sync spec from backend"
          branch: "bot/openapi-sync-${{ github.run_id }}"
          delete-branch: true
          title: "chore(openapi): sync spec from backend (${{ github.ref_name }})"
          body: |
            Auto-generated OpenAPI spec sync.

            Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`
            The `openapi-check` job detected a spec drift; this PR syncs `public/openapi.json` from the live backend.
          labels: openapi-sync
          base: ${{ github.ref_name }}
