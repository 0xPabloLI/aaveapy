name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
      - feature/merkl-forecast
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ref (branch or SHA) to run CI against"
        required: false
        type: string
  repository_dispatch:
    types:
      - ci-hardcode-sync

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.client_payload.ref || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      CI_REF: ${{ github.event.pull_request.head.sha || github.event.client_payload.ref || github.event.inputs.target_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_REF }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        run: |
          if [ "$(git log -1 --format='%an')" = "gpt-engineer-app[bot]" ]; then
            echo "Lovable commit detected – syncing lock file"
            npm install --package-lock-only
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
