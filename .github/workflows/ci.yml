name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
      - feature/merkl-forecast

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gpt-engineer-app[bot]') ||
          (github.event_name == 'push' && github.actor == 'gpt-engineer-app[bot]')
        run: |
          echo "Lovable commit detected – syncing lock file"
          npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync lock file (Lovable compat)
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gpt-engineer-app[bot]') ||
          (github.event_name == 'push' && github.actor == 'gpt-engineer-app[bot]')
        run: |
          echo "Lovable commit detected – syncing lock file"
          npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
