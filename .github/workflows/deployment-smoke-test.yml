# Post-deployment smoke test for Vercel frontend
# Polls Vercel API until the new deployment for this commit is READY,
# then checks that critical pages return HTTP 200 with valid HTML.
# On failure: auto-rollback via Vercel REST API → create GitHub Issue.
#
# Required GitHub secrets:
#   VERCEL_TOKEN          — Vercel API token (Account Settings → Tokens)
#   VERCEL_PROJECT_ID     — Vercel project ID (Project Settings → General)
#   VERCEL_TEAM_ID        — Vercel team ID (optional, omit for personal account)
name: Deployment Smoke Test

on:
  push:
    branches:
      - main
      - dev
      - lovable

permissions:
  contents: read
  issues: write

# Cancel in-progress runs on same branch (only latest push matters)
concurrency:
  group: smoke-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      # Map branch → site URL and environment target
      # lovable has no custom domain; SITE_URL is empty so site_check skips
      SITE_URL: ${{ github.ref_name == 'main' && 'https://aaveapy.com' || github.ref_name == 'dev' && 'https://staging.aaveapy.com' || '' }}
      ENV_LABEL: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'staging' || 'preview' }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      # Vercel Automation Bypass secret — required for ALL curl calls to Vercel-protected
      # custom domains (staging.aaveapy.com, aaveapy.com).  Exposed at job level so
      # every step can build the bypass header with the same one-liner:
      #   BYPASS_HEADER=""; [ -n "$VERCEL_BYPASS_SECRET" ] && BYPASS_HEADER="-H x-vercel-protection-bypass:$VERCEL_BYPASS_SECRET"
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Wait for Vercel deployment (poll commit SHA via API)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN secret not configured — skipping smoke test"
            echo "💡 To enable, add these GitHub repo secrets:"
            echo "   VERCEL_TOKEN, VERCEL_PROJECT_ID"
            exit 0
          fi

          EXPECTED_SHA="${{ github.sha }}"
          MAX_WAIT=600   # 10 minutes
          INTERVAL=15
          ELAPSED=0
          TEAM_PARAM=""
          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_PARAM="&teamId=${VERCEL_TEAM_ID}"
          fi

          echo "⏳ Waiting for ${{ env.ENV_LABEL }} deployment of commit ${EXPECTED_SHA:0:7}..."

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Use limit=20 to avoid missing our deployment when rapid pushes
            # push it past the first 5 results. Also include state=BUILDING,QUEUED,READY
            # to catch deployments that haven't reached READY yet.
            RESPONSE=$(curl -s --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=${{ env.VERCEL_TARGET }}&limit=20${TEAM_PARAM}")

            # Find deployment matching our commit SHA
            DEPLOY_STATE=$(echo "$RESPONSE" | jq -r \
              --arg sha "$EXPECTED_SHA" \
              '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0].state // empty')

            DEPLOY_URL=$(echo "$RESPONSE" | jq -r \
              --arg sha "$EXPECTED_SHA" \
              '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0].url // empty')

            DEPLOY_ID=$(echo "$RESPONSE" | jq -r \
              --arg sha "$EXPECTED_SHA" \
              '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0].uid // empty')

            if [ "$DEPLOY_STATE" = "READY" ]; then
              echo "✅ Deployment ready after ${ELAPSED}s (SHA: ${EXPECTED_SHA:0:7}, URL: ${DEPLOY_URL})"
              echo "DEPLOY_ID=${DEPLOY_ID}" >> "$GITHUB_ENV"
              echo "DEPLOY_URL=${DEPLOY_URL}" >> "$GITHUB_ENV"
              exit 0
            elif [ "$DEPLOY_STATE" = "ERROR" ] || [ "$DEPLOY_STATE" = "CANCELED" ]; then
              echo "❌ Deployment entered $DEPLOY_STATE state for commit ${EXPECTED_SHA:0:7}"
              exit 1
            fi

            echo "   ${ELAPSED}s — state: ${DEPLOY_STATE:-(not found yet)}"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          # Deployment was not found after full timeout.  This happens when Vercel
          # cancels a queued deployment due to a newer push (the concurrency cancel
          # in GitHub Actions mirrors on Vercel's side).  Exit 0 to avoid false-positive
          # smoke-test failures — the newer push's smoke test will cover the deployment.
          echo "⚠️ No deployment found for commit ${EXPECTED_SHA:0:7} after ${MAX_WAIT}s."
          echo "⚠️ This usually means Vercel canceled this deployment because a newer push superseded it."
          echo "⚠️ Treating as non-failure — the newer push will run its own smoke test."
          exit 0

      - name: Check production domain
        id: site_check
        if: env.SITE_URL != ''
        run: |
          # Build curl args as array to avoid shell expansion issues when bypass secret is empty
          SITE_CURL_ARGS=(-s -o /tmp/page.html -w "%{http_code}"
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors
            -L "${{ env.SITE_URL }}")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            SITE_CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_BYPASS_SECRET")
            echo "🔐 Using Vercel Automation Bypass for site check"
          else
            echo "⚠️ VERCEL_AUTOMATION_BYPASS_SECRET not configured — Vercel Authentication may block site check"
          fi

          echo "🌐 Checking ${{ env.ENV_LABEL }} site (${{ env.SITE_URL }})..."
          HTTP_CODE=$(curl "${SITE_CURL_ARGS[@]}")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ ${{ env.SITE_URL }} returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Check if we got a Vercel Authentication / interstitial page instead of the app.
          # Vercel auth pages may return HTTP 200 but won't contain our SPA markers.
          # We check for multiple Vercel-specific markers for robustness.
          if grep -qF 'Vercel Authentication' /tmp/page.html 2>/dev/null \
            || grep -qF '__VERCEL_TRACK_SUSPENSE_FALLBACK__' /tmp/page.html 2>/dev/null \
            || grep -qF 'x-is-human' /tmp/page.html 2>/dev/null; then
            echo "❌ Vercel Authentication/interstitial page detected — configure VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          # Verify it's our SPA (check for root div and module script)
          if ! grep -q 'id="root"' /tmp/page.html; then
            echo "❌ Page missing #root element — not our SPA (check Vercel Auth bypass or deployment status)"
            exit 1
          fi

          # Ensure custom domain serves this push's build (not a stale alias)
          EXPECTED_SHA="${{ github.sha }}"
          REF_NAME="${{ github.ref_name }}"

          page_has_expected_sha() {
            grep -Fq 'name="aaveapy-deploy-sha"' /tmp/page.html \
              && grep -Fq "content=\"${EXPECTED_SHA}\"" /tmp/page.html
          }

          if ! grep -Fq 'name="aaveapy-deploy-sha"' /tmp/page.html; then
            echo "❌ Page missing aaveapy-deploy-sha meta — redeploy with current build pipeline"
            exit 1
          fi

          if page_has_expected_sha; then
            echo "✅ ${{ env.SITE_URL }} accessible, SPA OK, deploy SHA matches push"
            exit 0
          fi

          # Custom domains lag behind Vercel READY — poll before failing (all branches)
          ALIAS_MAX_WAIT=300
          ALIAS_INTERVAL=15
          ALIAS_ELAPSED=0
          echo "⏳ Custom domain SHA mismatch — polling ${SITE_URL} up to ${ALIAS_MAX_WAIT}s for alias catch-up..."
          while [ $ALIAS_ELAPSED -lt $ALIAS_MAX_WAIT ]; do
            sleep $ALIAS_INTERVAL
            ALIAS_ELAPSED=$((ALIAS_ELAPSED + ALIAS_INTERVAL))
            ALIAS_CURL_ARGS=(-s -o /tmp/page.html -w "%{http_code}"
              --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors
              -L "${{ env.SITE_URL }}")
            if [ -n "$VERCEL_BYPASS_SECRET" ]; then
              ALIAS_CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_BYPASS_SECRET")
            fi
            HTTP_CODE=$(curl "${ALIAS_CURL_ARGS[@]}")
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "   ${ALIAS_ELAPSED}s — HTTP $HTTP_CODE"
              continue
            fi
            if page_has_expected_sha; then
              echo "✅ ${{ env.SITE_URL }} deploy SHA matched after ${ALIAS_ELAPSED}s alias catch-up"
              exit 0
            fi
            echo "   ${ALIAS_ELAPSED}s — still serving older deploy-sha"
          done

          echo "❌ SITE_URL does not expose expected commit ${EXPECTED_SHA:0:7} — domain may still point at an older deployment"
          exit 1

      - name: Check API connectivity from frontend
        id: api_check
        run: |
          echo "📊 Checking backend API from frontend context..."
          API_BASE="${{ github.ref_name == 'main' && 'https://api.aaveapy.com' || 'https://staging-api.aaveapy.com' }}"

          HTTP_CODE=$(curl -s -o /tmp/markets.json -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 30 --retry-all-errors \
            "${API_BASE}/api/markets")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Backend API returned HTTP $HTTP_CODE (frontend may still work with cached data)"
          else
            RESERVE_COUNT=$(jq '.reserves | length' /tmp/markets.json 2>/dev/null || echo "0")
            echo "Reserve count: $RESERVE_COUNT"

            if [ "$RESERVE_COUNT" -lt 50 ]; then
              echo "⚠️ Low reserve count ($RESERVE_COUNT), data may be incomplete"
            else
              echo "✅ Backend API OK — $RESERVE_COUNT reserves"
            fi
          fi

      - name: Check Vercel deployment URL
        id: deploy_url_check
        run: |
          if [ -z "${{ env.DEPLOY_URL }}" ]; then
            echo "⚠️ No deploy URL available — skipping"
            exit 0
          fi

          EXPECTED_SHA="${{ github.sha }}"
          DEPLOY_FULL_URL="https://${{ env.DEPLOY_URL }}"

          # Build curl args as array to avoid shell expansion issues when bypass secret is empty
          CURL_ARGS=(-s -o /tmp/deploy-page.html -w "%{http_code}"
            --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors
            -L "$DEPLOY_FULL_URL")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            CURL_ARGS+=(-H "x-vercel-protection-bypass:$VERCEL_BYPASS_SECRET")
            echo "🔐 Using Vercel Automation Bypass"
          else
            echo "⚠️ VERCEL_AUTOMATION_BYPASS_SECRET not configured"
          fi

          echo "🔗 Checking Vercel deployment URL ($DEPLOY_FULL_URL)..."
          HTTP_CODE=$(curl "${CURL_ARGS[@]}")

          echo "HTTP status: $HTTP_CODE"

          # Check if we got a Vercel Authentication / interstitial page instead of the app.
          if grep -qF 'Vercel Authentication' /tmp/deploy-page.html 2>/dev/null \
            || grep -qF '__VERCEL_TRACK_SUSPENSE_FALLBACK__' /tmp/deploy-page.html 2>/dev/null \
            || grep -qF 'x-is-human' /tmp/deploy-page.html 2>/dev/null; then
            echo "❌ Vercel Authentication/interstitial page detected — configure VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Deployment URL returned HTTP $HTTP_CODE"
            exit 1
          fi

          if ! grep -Fq 'name="aaveapy-deploy-sha"' /tmp/deploy-page.html; then
            echo "❌ Deployment URL missing aaveapy-deploy-sha meta"
            exit 1
          fi
          if ! grep -Fq "content=\"${EXPECTED_SHA}\"" /tmp/deploy-page.html; then
            echo "❌ Deployment URL does not serve commit ${EXPECTED_SHA:0:7}"
            exit 1
          fi

          echo "✅ Deployment URL accessible, deploy SHA matches push"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "  Smoke Test Summary (${{ env.ENV_LABEL }})"
          echo "========================================"
          echo "  Branch:         ${{ github.ref_name }}"
          echo "  Commit:         ${{ github.sha }}"
          echo "  Site URL:       ${{ env.SITE_URL }}"
          echo "  Deploy URL:     ${{ env.DEPLOY_URL }}"
          echo "  Deploy ID:      ${{ env.DEPLOY_ID }}"
          echo "  Site Check:     ${{ steps.site_check.outcome }}"
          echo "  API Check:      ${{ steps.api_check.outcome }}"
          echo "  Deploy Check:   ${{ steps.deploy_url_check.outcome }}"
          echo "========================================"

      - name: Auto-close stale smoke-test-failure issues on success
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const env = '${{ env.ENV_LABEL }}';
            const sha = '${{ github.sha }}';
            const branch = '${{ github.ref_name }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
            });

            // Match issues for this environment (title pattern: "🚨 {env} smoke test failed ...")
            const envIssues = issues.data.filter(i =>
              i.title.includes(env) && i.title.includes('smoke test failed')
            );

            if (envIssues.length === 0) {
              core.info(`No open smoke-test-failure issues for ${env} — nothing to close.`);
              return;
            }

            const commentBody = [
              `✅ Smoke test passed for **${env}** — closing this issue automatically.`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Branch | ${branch} |`,
              `| Commit | \`${sha.slice(0, 7)}\` |`,
              `| Workflow Run | [View run](${runUrl}) |`,
            ].join('\n');

            for (const issue of envIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed issue #${issue.number} (${issue.title})`);
            }

  # ── Auto-rollback on smoke test failure ──
  rollback:
    needs: smoke-test
    if: failure()
    runs-on: ubuntu-latest
    env:
      ENV_LABEL: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'staging' || 'preview' }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Rollback Vercel deployment
        id: rollback
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️ VERCEL_TOKEN not configured — skipping auto-rollback"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REF_NAME="${{ github.ref_name }}"

          # Instant project rollback aliases production; preview deployments are not safe targets.
          if [ "$REF_NAME" != "main" ]; then
            echo "⚠️ Branch ${REF_NAME} uses Vercel preview — skipping instant project rollback."
            echo "💡 Manual recovery for staging (${{ env.ENV_LABEL }}):"
            echo "   1. Open Vercel → project → Deployments (preview / branch ${REF_NAME})"
            echo "   2. Promote the last known-good READY deployment to staging.aaveapy.com"
            echo "      OR revert commit ${{ github.sha }} on ${REF_NAME} and push"
            echo "   3. Confirm https://staging.aaveapy.com meta aaveapy-deploy-sha matches the good commit"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TEAM_PARAM=""
          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_PARAM="&teamId=${VERCEL_TEAM_ID}"
          fi

          echo "🔍 Fetching recent ${{ env.ENV_LABEL }} deployments..."

          DEPLOYMENTS=$(curl -s --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=${{ env.VERCEL_TARGET }}&state=READY&limit=20${TEAM_PARAM}")

          echo "Recent deployments:"
          echo "$DEPLOYMENTS" | jq '[.deployments[] | {uid: .uid[0:12], state, url, created: .created, sha: (.meta.githubCommitSha // "")[0:7], ref: .meta.githubCommitRef}]' 2>/dev/null

          # Previous READY deployment on the same Git ref only (avoid unrelated branch SHAs).
          # Normalize refs: GitHub exposes github.ref_name as "main" while Vercel meta.githubCommitRef is often "refs/heads/main".
          CURRENT_SHA="${{ github.sha }}"
          ROLLBACK_ID=$(echo "$DEPLOYMENTS" | jq -r \
            --arg sha "$CURRENT_SHA" \
            --arg ref "$REF_NAME" \
            '
            def norm:
              if . == "" then ""
              elif startswith("refs/heads/") then .[11:]
              else . end;
            [.deployments[] | select(
              .state == "READY"
              and (.meta.githubCommitSha // "") != $sha
              and ((.meta.githubCommitRef // "") | norm) == ($ref | norm)
            )] | .[0].uid // empty
            ')

          if [ -z "$ROLLBACK_ID" ]; then
            echo "❌ No rollback-eligible deployment found for ${{ env.ENV_LABEL }} (ref=${REF_NAME})"
            exit 1
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "🔄 Rolling back ${{ env.ENV_LABEL }} to deployment: ${ROLLBACK_ID:0:12}..."

          TEAM_QS=""
          if [ -n "$VERCEL_TEAM_ID" ]; then
            TEAM_QS="?teamId=${VERCEL_TEAM_ID}"
          fi

          HTTP_CODE=$(curl -sS -o /tmp/rollback.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/rollback/${ROLLBACK_ID}${TEAM_QS}")
          ROLLBACK_RESULT=$(cat /tmp/rollback.json)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Rollback HTTP ${HTTP_CODE}"
            echo "$ROLLBACK_RESULT" | jq . 2>/dev/null || echo "$ROLLBACK_RESULT"
            exit 1
          fi

          # v1/rollback returns 2xx on success; response shape varies by API version
          # (may contain jobId, status, deployment, or just an alias assignment)
          if echo "$ROLLBACK_RESULT" | jq -e '.error' > /dev/null 2>&1; then
            echo "❌ Rollback API returned an error object"
            echo "$ROLLBACK_RESULT" | jq . 2>/dev/null || echo "$ROLLBACK_RESULT"
            exit 1
          fi

          echo "✅ Vercel ${{ env.ENV_LABEL }} rollback accepted (2xx, no error field)"
          echo "$ROLLBACK_RESULT" | jq . 2>/dev/null || echo "$ROLLBACK_RESULT"

      - name: Create rollback notification issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const env = '${{ env.ENV_LABEL }}';
            const sha = '${{ github.sha }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const rollbackOutcome = '${{ steps.rollback.outcome }}' || 'unknown';
            const rollbackSkipped = '${{ steps.rollback.outputs.skipped }}' === 'true';
            let rollbackStatus;
            if (rollbackSkipped) {
              rollbackStatus = '⏭️ Auto-rollback skipped (preview branch or token missing) — manual recovery if needed';
            } else if (rollbackOutcome === 'success') {
              rollbackStatus = '✅ Auto-rollback initiated — previous deployment being restored';
            } else {
              rollbackStatus = '❌ Auto-rollback failed — manual intervention required';
            }

            const failureEntry = [
              `## Repeat Trigger — \`${sha.slice(0, 7)}\``,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Commit | \`${sha.slice(0, 7)}\` |`,
              `| Rollback | ${rollbackStatus} |`,
              `| Workflow Run | [View logs](${runUrl}) |`,
            ].join('\n');

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
            });

            const dedupTitle = `🚨 ${env} smoke test failed — deployment rolled back`;
            const match = existingIssues.data.find(i => i.title === dedupTitle);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: failureEntry,
              });
              core.info(`Dedup: appended to existing issue #${match.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: dedupTitle,
                body: [
                  `## Smoke Test Failure (${env})`,
                  '',
                  `| Field | Value |`,
                  `|-------|-------|`,
                  `| Environment | **${env}** |`,
                  `| Commit | \`${sha.slice(0, 7)}\` |`,
                  `| Rollback | ${rollbackStatus} |`,
                  `| Workflow Run | [View logs](${runUrl}) |`,
                  '',
                  'Check the workflow logs for details on which check failed.',
                  '',
                  '> **Note:** After rollback, Vercel disables auto-assignment of production domains.',
                  '> Push a fix and then run `vercel promote` or re-enable auto-assign in project settings.',
                ].join('\n'),
                labels: ['smoke-test-failure'],
              });
            }
