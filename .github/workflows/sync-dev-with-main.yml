name: Sync dev with main

on:
  pull_request:
    types: [closed]

jobs:
  sync-dev:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Align dev ref to main tip
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseRef = context.payload.pull_request.base.ref;
            const headRef = context.payload.pull_request.head.ref;

            const base = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${baseRef}`,
            });

            const targetSha = base.data.object.sha;
            core.info(`Target ${baseRef} SHA: ${targetSha}`);

            const head = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${headRef}`,
            });

            if (head.data.object.sha === targetSha) {
              core.info(`${headRef} already aligned with ${baseRef}`);
              return;
            }

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${headRef}`,
              sha: targetSha,
              force: true,
            });

            core.info(`Aligned ${headRef} -> ${baseRef} at ${targetSha}`);
