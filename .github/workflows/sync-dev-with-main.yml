name: Sync dev with main

on:
  pull_request:
    types: [closed]

jobs:
  sync-dev:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if sync is needed
        id: check
        run: |
          git fetch origin main dev
          DEV_SHA=$(git rev-parse origin/dev)
          MAIN_SHA=$(git rev-parse origin/main)

          if [ "$DEV_SHA" = "$MAIN_SHA" ]; then
            echo "reason=dev already aligned with main" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff origin/main origin/dev --quiet; then
            echo "reason=Content identical (SHA differs only due to merge commit)" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MERGE_BASE=$(git merge-base origin/main origin/dev)
          if [ "$MERGE_BASE" = "$MAIN_SHA" ]; then
            echo "reason=dev is ahead of main" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create sync PR
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'dev',
              head: 'main',
            });
            if (prs.length > 0) {
              core.info(`Sync PR already exists: #${prs[0].number}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Sync main → dev',
              head: 'main',
              base: 'dev',
              body: 'Auto-created: sync main into dev after dev→main merge.',
            });
            core.info(`Created sync PR #${pr.number}`);
