# Read-only guard on the default branch. When live /markets gains a new chainId, merge the bot PR from
# Hardcode Sync (schedule targets the same default branch) or run sync locally—main stays red until then.
name: Hardcode Drift Check

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # After Hardcode Sync (04:20 UTC) so automated sync + PR land first; merge bot PRs to clear drift.
    - cron: "0 5 * * *"

jobs:
  check-hardcode-icons:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check reservePatches icon symbols
        run: npm run check:hardcode-icons

      - name: Check reservePatches drift against aave/interface
        run: npm run check:reserve-patches-upstream

      - name: Check MARKET_NAME_MAP drift against aave/interface
        run: npm run check:market-name-map-upstream

      - name: Check chainIconMap drift against aave/interface
        run: npm run check:chain-icons-upstream

      - name: Check CoinGecko platform map drift for market chainIds
        env:
          # Repository variable LIVE_TEST_API_BASE_CI (Settings → Actions → Variables); scoped here so checkout logs stay clean.
          LIVE_TEST_API_BASE_CI: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: npm run check:coingecko-platform-map-upstream

      - name: Check pool address drift against aave-address-book
        run: npm run check:pool-addresses-upstream
