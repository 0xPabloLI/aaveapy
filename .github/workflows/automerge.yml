name: Auto Merge

on:
  pull_request_target:
    types: [opened, labeled, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (enable-early)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    number
                    reviewDecision
                    mergeStateStatus
                    autoMergeRequest {
                      enabledAt
                    }
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                      }
                    }
                  }
                }
              }
            `;
            const data = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });
            const prInfo = data.repository.pullRequest;
            const unresolvedThreads = prInfo.reviewThreads.nodes.filter((thread) => !thread.isResolved).length;
            if (prInfo.reviewDecision === 'CHANGES_REQUESTED' || prInfo.reviewDecision === 'REVIEW_REQUIRED' || unresolvedThreads > 0) {
              core.notice(
                `Skip enabling auto-merge for PR #${pr.number}: reviewDecision=${prInfo.reviewDecision || 'NONE'}, unresolvedThreads=${unresolvedThreads}`
              );
              return;
            }
            if (prInfo.autoMergeRequest) {
              core.info(`Auto-merge already enabled for PR #${pr.number}`);
              return;
            }

            const enableAutoMergeMutation = `
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                  }
                }
              }
            `;

            const statusQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    mergeStateStatus
                  }
                }
              }
            `;

            try {
              await github.graphql(enableAutoMergeMutation, { pullRequestId: prInfo.id });
              core.info(`Enabled auto-merge for PR #${pr.number}`);
              return;
            } catch (error) {
              const message = String(error.message || error);
              const isUnstable = message.toLowerCase().includes('unstable status');

              if (!isUnstable) {
                core.warning(`Enable auto-merge failed for PR #${pr.number}: ${message}`);
                return;
              }

              // CI is still running (UNSTABLE or UNKNOWN). Retry for up to 5 minutes
              // (10 × 30s) — CI typically takes 2-3 minutes to complete.
              core.info(`PR #${pr.number} unstable status; will retry with 30s backoff...`);

              for (let attempt = 1; attempt <= 10; attempt++) {
                await new Promise((r) => setTimeout(r, 30000));

                let currentStatus;
                try {
                  const { repository: { pullRequest: current } } = await github.graphql(statusQuery, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    number: pr.number
                  });
                  currentStatus = current.mergeStateStatus;
                } catch (queryError) {
                  core.warning(`Retry ${attempt}/10: failed to query mergeStateStatus: ${queryError.message}`);
                  continue;
                }

                core.info(`Retry ${attempt}/10: mergeStateStatus=${currentStatus}`);

                if (currentStatus === 'CLEAN') {
                  try {
                    await github.rest.pulls.merge({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number,
                      merge_method: 'squash',
                    });
                    core.info(`PR #${pr.number} became CLEAN on retry ${attempt}/10; merged directly.`);
                    return;
                  } catch (mergeError) {
                    core.warning(`Direct merge failed on retry ${attempt}/10: ${mergeError.message}`);
                  }
                }

                // Try enabling auto-merge regardless of status
                try {
                  await github.graphql(enableAutoMergeMutation, { pullRequestId: prInfo.id });
                  core.info(`Enabled auto-merge for PR #${pr.number} on retry ${attempt}/10`);
                  return;
                } catch (retryError) {
                  core.warning(`Retry ${attempt}/10 enableAutoMerge failed: ${retryError.message}`);
                }
              }

              core.warning(`Could not enable auto-merge for PR #${pr.number} after 10 retries (5 min).`);
            }
