name: Hardcode Sync

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to run hardcode sync on (defaults to dev)"
        required: false
        type: string
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 04:20 UTC
    - cron: "20 4 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  hardcode-sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: >-
        ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_branch != '' && github.event.client_payload.target_branch || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch != '' && github.event.inputs.target_branch || 'dev') }}
      HAS_HARDCODE_SYNC_PAT: ${{ secrets.HARDCODE_SYNC_PAT != '' }}
      VITE_API_BASE_URL: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://api.aaveapy.com/api' }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Log trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "target_branch=${{ env.TARGET_BRANCH }}"
          echo "api_base=${{ env.VITE_API_BASE_URL }}"
          echo "client_payload=${{ toJSON(github.event.client_payload) }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Round 1 sync
        run: npm run hardcode:sync

      - name: Round 1 verify
        id: verify_round1
        run: |
          set +e
          npm run hardcode:verify
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Round 2 sync
        if: steps.verify_round1.outputs.passed != 'true'
        run: npm run hardcode:sync

      - name: Round 2 verify
        id: verify_round2
        if: steps.verify_round1.outputs.passed != 'true'
        run: |
          set +e
          npm run hardcode:verify
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Create PR when hardcode changed
        id: cpr
        if: >
          steps.verify_round1.outputs.passed == 'true' ||
          steps.verify_round2.outputs.passed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Use PAT to ensure pull_request workflows (CI lint/build) are triggered on the created PR.
          # Fallback to GITHUB_TOKEN keeps behavior but may leave required checks in "Expected".
          token: ${{ secrets.HARDCODE_SYNC_PAT != '' && secrets.HARDCODE_SYNC_PAT || github.token }}
          commit-message: "chore(hardcode): sync hardcoded assets and mappings"
          title: "chore(hardcode): sync hardcoded assets and mappings"
          body: |
            Automated update from `npm run hardcode:sync`.

            Verification:
            - `npm run hardcode:verify`
          branch: "bot/hardcode-sync"
          base: ${{ env.TARGET_BRANCH }}
          delete-branch: true
          labels: |
            automation
            hardcode

      - name: Warn when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_HARDCODE_SYNC_PAT != 'true'
        run: |
          echo "::warning::HARDCODE_SYNC_PAT is not configured. PR was created with GITHUB_TOKEN, so pull_request CI may stay in 'Expected'. Fallback workflow_dispatch CI will be triggered on the PR branch."

      - name: Trigger fallback CI when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_HARDCODE_SYNC_PAT != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRef = `${{ steps.cpr.outputs.pull-request-branch }}` || 'bot/hardcode-sync';
            const targetRef = `${{ steps.cpr.outputs.pull-request-head-sha }}` || workflowRef;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: workflowRef,
              inputs: {
                target_ref: targetRef
              }
            });
            core.info(`Triggered fallback workflow_dispatch for ci.yml on ref ${workflowRef}, target_ref ${targetRef}`);

      - name: Create issue when verify still fails
        if: >
          steps.verify_round1.outputs.passed != 'true' &&
          steps.verify_round2.outputs.passed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Hardcode Sync] verify failed after retry';
            const payload = context.payload.client_payload || {};
            const body = [
              'Hardcode sync verify failed after two rounds.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Target branch: ${process.env.TARGET_BRANCH}`,
              `Trigger event: ${context.eventName}`,
              `Payload source: ${payload.sourceRepo || payload.source || '<none>'}`,
              `Payload ref: ${payload.ref || '<none>'}`,
              '',
              'Please inspect upstream drift and sync scripts.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation,hardcode,drift',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Appended failure details to existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation', 'hardcode', 'drift']
              });
              core.info('Created a new hardcode verify failure issue');
            }

      - name: Fail job when verify still fails
        if: >
          steps.verify_round1.outputs.passed != 'true' &&
          steps.verify_round2.outputs.passed != 'true'
        run: |
          echo "Hardcode verify failed after two rounds."
          exit 1
