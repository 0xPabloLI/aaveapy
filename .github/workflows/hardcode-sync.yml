name: Hardcode Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 04:20 UTC (runs against dev and main — see matrix)
    - cron: "20 4 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  hardcode-sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        target_branch: [dev, main]
    runs-on: ubuntu-latest
    env:
      # One job per branch: drift on `main` and integration on `dev` both get matching bot PRs.
      TARGET_BRANCH: ${{ matrix.target_branch }}
      HAS_HARDCODE_SYNC_PAT: ${{ secrets.HARDCODE_SYNC_PAT != '' }}
      # LIVE_TEST_API_BASE_CI is injected only on steps that call /markets (see Round N sync/verify) so
      # checkout/setup-node logs do not print the repository variable value. Prefer a GitHub *secret*
      # for that URL if you need masking in run-step env blocks too.
    steps:
      - name: Checkout target branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Log trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "target_branch=${{ env.TARGET_BRANCH }}"
          echo "live_test_api_base_ci_source=${{ vars.LIVE_TEST_API_BASE_CI != '' && 'repository_variable' || 'workflow_default_staging' }}"
          echo "repository_dispatch=${{ github.event_name == 'repository_dispatch' && 'true' || 'false' }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "client_payload=${{ toJSON(github.event.client_payload) }}"
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Round 1 sync
        id: sync_round1
        env:
          LIVE_TEST_API_BASE_CI: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: |
          set +e
          npm run hardcode:sync
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Round 1 sync exited with code $status"
          fi
          exit 0

      - name: Round 1 verify
        id: verify_round1
        env:
          LIVE_TEST_API_BASE_CI: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: |
          set +e
          npm run hardcode:verify
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Round 2 sync
        if: steps.verify_round1.outputs.passed != 'true'
        id: sync_round2
        env:
          LIVE_TEST_API_BASE_CI: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: |
          set +e
          npm run hardcode:sync
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Round 2 sync exited with code $status"
          fi
          exit 0

      - name: Round 2 verify
        id: verify_round2
        if: steps.verify_round1.outputs.passed != 'true'
        env:
          LIVE_TEST_API_BASE_CI: ${{ vars.LIVE_TEST_API_BASE_CI != '' && vars.LIVE_TEST_API_BASE_CI || 'https://staging-api.aaveapy.com/api' }}
        run: |
          set +e
          npm run hardcode:verify
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Create PR when hardcode changed
        id: cpr
        if: >
          steps.verify_round1.outputs.passed == 'true' ||
          steps.verify_round2.outputs.passed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Use PAT to ensure pull_request workflows (CI lint/build) are triggered on the created PR.
          # Fallback to GITHUB_TOKEN keeps behavior but may leave required checks in "Expected".
          token: ${{ secrets.HARDCODE_SYNC_PAT != '' && secrets.HARDCODE_SYNC_PAT || github.token }}
          commit-message: "chore(hardcode): sync hardcoded assets and mappings"
          title: "chore(hardcode): sync hardcoded assets and mappings"
          body: |
            Automated update from `npm run hardcode:sync`.

            Verification:
            - `npm run hardcode:verify`
          branch: bot/hardcode-sync-${{ matrix.target_branch }}
          base: ${{ env.TARGET_BRANCH }}
          delete-branch: true
          labels: |
            automerge
            hardcode

      - name: Warn when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_HARDCODE_SYNC_PAT != 'true'
        run: |
          echo "::warning::HARDCODE_SYNC_PAT is not configured. PR was created with GITHUB_TOKEN, so pull_request CI may stay in 'Expected'. Fallback workflow_dispatch CI will be triggered on the PR branch."

      - name: Trigger fallback CI when PAT is missing
        if: steps.cpr.outputs.pull-request-number != '' && env.HAS_HARDCODE_SYNC_PAT != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRef = `${{ steps.cpr.outputs.pull-request-branch }}` || 'bot/hardcode-sync-${{ matrix.target_branch }}';
            const targetRef = `${{ steps.cpr.outputs.pull-request-head-sha }}` || workflowRef;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: workflowRef,
              inputs: {
                target_ref: targetRef
              }
            });
            core.info(`Triggered fallback workflow_dispatch for ci.yml on ref ${workflowRef}, target_ref ${targetRef}`);

      - name: Create issue when verify still fails
        if: >
          steps.verify_round1.outputs.passed != 'true' &&
          steps.verify_round2.outputs.passed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[Hardcode Sync] verify failed after retry';
            const syncR1 = '${{ steps.sync_round1.outputs.passed }}';
            const syncR2 = '${{ steps.sync_round2.outputs.passed }}';
            const payload = context.payload.client_payload || {};
            const body = [
              'Hardcode sync verify failed after two rounds.',
              '',
              `Sync Round 1: ${syncR1 === 'true' ? '✅' : '❌'}`,
              `Sync Round 2: ${syncR2 === 'true' ? '✅' : syncR2 === '' ? '⏭️ skipped' : '❌'}`,
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Target branch: ${process.env.TARGET_BRANCH}`,
              `Trigger event: ${context.eventName}`,
              `Payload source: ${payload.sourceRepo || payload.source || '<none>'}`,
              `Payload ref: ${payload.ref || '<none>'}`,
              '',
              'Please inspect upstream drift and sync scripts.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'hardcode,drift',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Appended failure details to existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['hardcode', 'drift']
              });
              core.info('Created a new hardcode verify failure issue');
            }

      - name: Fail job when verify still fails
        if: >
          steps.verify_round1.outputs.passed != 'true' &&
          steps.verify_round2.outputs.passed != 'true'
        run: |
          echo "Sync Round 1: ${{ steps.sync_round1.outputs.passed }}"
          echo "Sync Round 2: ${{ steps.sync_round2.outputs.passed }}"
          echo "Hardcode sync/verify failed after two rounds."
          exit 1
